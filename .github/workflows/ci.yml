name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (PRs especially).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379/15
      QDRANT_PATH: var/qdrant_ci
      WHISPER_MODEL: tiny
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Test (vitest)
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only deploy from main, and only when the deploy secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy (API + worker)
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        # The hook also re-runs the idempotent bootstrap, so seed/models refresh
        # only when the corpus or artifacts are missing.

      - name: Deploy frontend to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN" --cwd web
