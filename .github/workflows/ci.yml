name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (PRs especially).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379/15
      QDRANT_PATH: var/qdrant_ci
      WHISPER_MODEL: tiny
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Test (vitest)
        run: npm test

  deploy-config:
    name: Deploy config - validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches shell bugs, a broken Caddyfile, an invalid Compose file or a
      # malformed workflow before it reaches the VM.
      - name: Lint workflow (actionlint)
        uses: raven-actions/actionlint@v2

      - name: Lint deploy scripts (shellcheck)
        run: shellcheck -S warning deploy/oracle/*.sh

      - name: Validate compose file
        run: |
          set -euo pipefail
          cp deploy/oracle/.env.example deploy/oracle/.env
          docker compose --env-file deploy/oracle/.env \
            -f deploy/oracle/docker-compose.prod.yml config --quiet

      - name: Validate Caddyfile
        run: |
          set -euo pipefail
          docker run --rm \
            -e API_DOMAIN=api.203.0.113.10.sslip.io \
            -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.9-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [backend, frontend, deploy-config]
    # Deploy only from main. Individual steps check whether their secrets are
    # configured, so a repository without deployment credentials still passes.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_SSH_HOST_KEY: ${{ secrets.ORACLE_SSH_HOST_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect configured deploy targets
        id: targets
        shell: bash
        run: |
          if [ -n "$ORACLE_HOST" ] && [ -n "$ORACLE_SSH_KEY" ]; then
            echo "oracle=true" >> "$GITHUB_OUTPUT"
          else
            echo "oracle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Oracle deploy secrets are not configured; skipping the backend deployment."
          fi
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "vercel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel CLI secrets are not configured; skipping the frontend deployment."
          fi

      - name: Deploy backend over SSH
        if: steps.targets.outputs.oracle == 'true'
        shell: bash
        env:
          SSH_HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.ORACLE_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/civiclens_oracle"
          chmod 600 "$HOME/.ssh/civiclens_oracle"

          # Pin the host key when ORACLE_SSH_HOST_KEY is set; otherwise trust
          # the key presented on this first connection (TOFU, like a manual ssh).
          if [ -n "$SSH_HOST_KEY" ]; then
            printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi

          ssh -i "$HOME/.ssh/civiclens_oracle" -p "$SSH_PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            'cd /opt/civiclens/deploy/oracle && ./deploy.sh'

      - name: Deploy frontend to Vercel
        if: steps.targets.outputs.vercel == 'true'
        # `web` is the Vercel project's Root Directory, so the CLI must run
        # there rather than at the repository root.
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # `pull` also downloads the project's VITE_API_BASE_URL, so the Vite
          # build receives the same API origin as a Git-integration deploy.
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
